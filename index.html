<!DOCTYPE html>
<html lang="es" class="h-100">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Terminal - Conversor de Temperatura</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body
        class="bg-custom text-light font-monospace d-flex flex-column align-items-center h-100 p-5"
    >
        <h1 class="display-1">Converter</h1>
        <div class="container-fluid max-w-lg">
            <div class="border-secondary p-2 mb-3 bg-black">
                <p class="mb-0 text-success h3">$ CONVERT-TEMP v0.1</p>
            </div>

            <div
                id="terminal-output"
                class="terminal-custom border border-secondary p-3 mb-3 bg-black overflow-auto"
            >
                <p class="mb-0 text-secondary">
                    Escribe la temperatura en Celsius y presiona ENTER o el
                    botón `Ejecutar`.
                </p>
                <div class="text-secondary">
                    [SYSTEM READY] Esperando entrada de datos...
                </div>
            </div>

            <form id="terminal-form" onsubmit="return false;">
                <div class="input-group">
                    <span
                        class="input-group-text bg-black text-success border-secondary fw-bold"
                        >&gt; celsius_val:</span
                    >
                    <input
                        type="text"
                        id="celsius-input"
                        class="form-control bg-black text-light border-secondary font-monospace"
                        placeholder="ej. 45"
                        autocomplete="off"
                    />
                    <button
                        type="submit"
                        id="submit-btn"
                        class="btn btn-outline-success border-secondary"
                    >
                        EJECUTAR
                    </button>
                </div>
            </form>
        </div>

        <!-- Script del Conversor (POO) -->
        <script type="module" src="main.js"></script>
        <script type="module" src="script.js"></script>
        <script type="module" src="terminal.js"></script>
    </body>
</html>
